AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 bucket for EasyDraw's shared library and user-uploaded images

Parameters:
  ClientOrigin:
    Type: String
    Default: https://easydraw.net
    Description: Production frontend origin allowed to upload and display assets
  LocalClientOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Local frontend origin used during development

Resources:
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref ClientOrigin
              - !Ref LocalClientOrigin
            AllowedMethods:
              - GET
              - POST
              - HEAD
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAbandonedPendingUploads
            Status: Enabled
            Prefix: pending/
            ExpirationInDays: 1
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

Outputs:
  BucketName:
    Description: Set this as AWS_S3_ASSETS_BUCKET on the API
    Value: !Ref AssetsBucket
  BucketArn:
    Description: Scope the ECS task role object permissions to this ARN plus /*
    Value: !GetAtt AssetsBucket.Arn
